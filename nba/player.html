<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="apple-itunes-app"
      content="app-id=6754208862, app-argument=https://sportsheart.ca/"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player - NBA - SportsHeart</title>
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="stylesheet" href="/assets/dark-mode.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="/assets/analytics.js"></script>
  </head>
  <body>
    <div class="screen-size-warning">
      <div class="screen-size-warning-icon">📱</div>
      <h2>Desktop Only</h2>
      <p>
        SportsHeart is optimized for desktop viewing (1366px+). Download our app
        for mobile.
      </p>
      <div class="store-buttons">
        <a
          href="https://apps.apple.com/app/id6754208862"
          class="store-btn"
          target="_blank"
          rel="noopener"
          >App Store</a
        >
        <a
          href="https://play.google.com/store/apps/details?id=com.sportsheart.app"
          class="store-btn"
          target="_blank"
          rel="noopener"
          >Google Play</a
        >
      </div>
    </div>

    <nav class="navbar">
      <div class="navbar-left">
        <a href="/" class="navbar-logo"
          ><img
            src="/icon.png"
            alt="SportsHeart"
            onerror="this.style.display = 'none'"
          /><img
            style="margin-top: 5px"
            src="assets/33115791.png"
            alt="SportsHeart"
            onerror="this.style.display = 'none'"
          />
          <span>SportsHeart</span></a
        >
      </div>
      <div class="navbar-center">
        <a href="/mlb/aio.html" class="nav-link">MLB</a>
        <a href="/nhl/aio.html" class="nav-link">NHL</a>
        <a href="/nba/aio.html" class="nav-link active">NBA</a>
        <a href="/nfl/aio.html" class="nav-link">NFL</a>
        <a href="/wnba/aio.html" class="nav-link">WNBA</a>
      </div>
      <div class="navbar-right"><div id="auth-button-container"></div></div>
    </nav>

    <div class="team-page-container">
      <div class="player-header" id="playerHeader"></div>
      <div class="team-tabs" id="playerTabs">
        <button class="team-tab active" data-tab="stats">Stats</button>
        <button class="team-tab" data-tab="gamelog">Game Log</button>
        <button class="team-tab" data-tab="career">Career</button>
      </div>
      <div id="playerContent">
        <div class="loading"><div class="loading-spinner"></div></div>
      </div>
    </div>

    <script src="/assets/sports-data-service.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/assets/auth.js"></script>
    <script src="/assets/split-screen.js"></script>
    <script src="player.js"></script>
  </body>
</html>

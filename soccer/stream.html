<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Stream Widget - Blank Template</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        height: 10%;
        margin: 0;
        background: transparent;
      }
      /* place widget in top-left for OBS */
      body {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        padding-top: 200px;
        padding-left: 50px;
      }

      /* Scale wrapper useful for OBS sizing */
      #scaleWrapper {
        transform: scale(2);
        transform-origin: top left;
      }

      .stream-widget {
        width: 1250px;
        max-width: 1250px;
        height: 160px;
        position: relative;
      }

      /* Outer left/right colored bars (sit above center pills) */
      .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 160px;
        border-radius: 18px;
        z-index: 6;
        pointer-events: none;
        border: 8px solid rgba(160, 160, 160);
      }
      .bar.left {
        left: 0;
        background: linear-gradient(90deg, #0b4aa6 0%, #0b3a8a 100%);
      }
      .bar.right {
        right: 0;
        background: linear-gradient(270deg, #b91f1f 0%, #7a0c0c 100%);
      }
      .bar img {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-49.5%, -49.5%);
        width: 159px;
        height: 145px;
        object-fit: cover;
        border-radius: 8px;
      }

      /* Center wrapper for nested pills */
      .center-pill {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 10px;
        bottom: 10px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        pointer-events: none;
      }

      /* Three nested pills: outer -> red -> black */
      /* Back red pill behind the outer pill (vertical gradient top->bottom) */
      .back-red-pill {
        position: absolute;
        left: 240px;
        right: 240px;
        top: 6px;
        height: 145px;
        border-radius: 999px;
        background: linear-gradient(180deg, #4b0707, #c22b2b);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        z-index: 1;
      }

      /* Outer pill uses horizontal gradient from left color -> black -> right color */
      /* Outer pill clips contents so inner pills can be larger but visually contained */
      .outer-pill {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 90%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          #0b4aa6 0%,
          #000000 48%,
          #000000 52%,
          #b91f1f 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6) inset;
        z-index: 3;
      }

      /* Use a CSS variable for adjustable height; default 110% */
      .red-pill {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 35%;
        height: var(--red-height, 140%);
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgba(185, 31, 31),
          rgba(185, 31, 31)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45);
        z-index: 4;
      }

      .black-pill {
        position: relative;
        width: 90%;
        height: 100%;
        border-radius: 999px;
        background: radial-gradient(
          circle at 50% 50%,
          rgb(100, 100, 100),
          rgb(17, 17, 17) 47.5%
        );
        display: block;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        z-index: 5;
      }

      /* Small center dash centered inside black-pill */
      .center-dash {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 22px;
        height: 10px;
        background: rgba(185, 31, 31);
      }

      /* Icon positioned under the dash inside black-pill */
      .center-icon {
        position: absolute;
        left: 50%;
        top: calc(50% + 18px);
        transform: translateX(-50%);
        width: 40px;
        height: auto;
        display: block;
        opacity: 0.98;
      }

      /* Numbers inside black-pill (left/right of the center dash) */
      .black-pill .left-number,
      .black-pill .right-number {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: #ffffff;
        font-weight: 800;
        font-size: 100px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        z-index: 6;
        pointer-events: none;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        display: inline-block;
        transform-origin: center;
      }
      .black-pill .left-number {
        left: 12.5%;
      }
      .black-pill .right-number {
        right: 12.5%;
      }

      /* team names on the outer pill (left/right) */
      .outer-pill .outer-left-text,
      .outer-pill .outer-right-text {
        position: absolute;
        top: 50%;
        transform: translateY(-50%) scaleY(1.75);
        color: #ffffff;
        font-weight: 800;
        font-size: 45px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        z-index: 6;
        pointer-events: none;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        display: inline-block;
        transform-origin: center;
      }
      .outer-pill .outer-left-text {
        left: -250px;
        text-align: left;
      }
      .outer-pill .outer-right-text {
        right: -250px;
        text-align: right;
      }

      /* team names on outer pill sides */
      .outer-left-text,
      .outer-right-text {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: #ffffff;
        font-weight: 800;
        font-size: 45px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        z-index: 6;
        pointer-events: none;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }
      .outer-left-text {
        left: 6%;
        text-align: left;
      }
      .outer-right-text {
        right: 6%;
        text-align: right;
      }

      /* center red circle text */
      .center-red-text {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, 0%);
        color: #fff;
        font-weight: 700;
        font-size: 50px;
        z-index: 3;
        pointer-events: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        display: inline-block;
        transform-origin: center;
        white-space: nowrap;
      }

      .top-red-text {
        position: absolute;
        left: 50%;
        bottom: 57.5%;
        transform: translate(-50%, 0%);
        color: #fff;
        font-weight: 700;
        font-size: 30px;
        z-index: 3;
        pointer-events: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        display: inline-block;
        transform-origin: center;
        white-space: nowrap;
      }

      /* Center red semicircle behind the center-pill */
      .center-red-circle {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: -50px;
        width: 420px;
        height: 110px;
        border-radius: 999px;
        background: linear-gradient(0deg, #5a0909, #c22b2b);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        z-index: 2;
        pointer-events: none;
      }

      /* Top red semicircle (above the widget) */
      .top-red-circle {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: -40px;
        width: 820px;
        height: 110px;
        border-radius: 999px;
        background: linear-gradient(180deg, #5a0909, #c22b2b);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        z-index: 2;
        pointer-events: none;
      }

      /* Make widget transparent for OBS layering */
      .stream-widget,
      .stream-widget * {
        background-clip: padding-box;
      }

      @media (max-width: 600px) {
        #scaleWrapper {
          transform: scale(1);
        }
        .stream-widget {
          width: 560px;
          height: 90px;
        }
      }
    </style>
  </head>
  <body>
    <div id="scaleWrapper">
      <div class="stream-widget" id="streamWidget">
        <div class="bar left" aria-hidden="true">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Flag_of_Kosovo.svg/3840px-Flag_of_Kosovo.svg.png"
            alt=""
          />
        </div>
        <div class="bar right" aria-hidden="true">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Flag_of_Turkey.svg/1280px-Flag_of_Turkey.svg.png"
            alt=""
          />
        </div>
        <div class="back-red-pill" aria-hidden="true"></div>
        <div class="top-red-circle" aria-hidden="true">
          <div class="top-red-text">GOAL ! ⚽ Arda Güler (1) - 88'</div>
        </div>
        <div class="center-red-circle" aria-hidden="true">
          <div class="center-red-text">87:43 - 2nd Half</div>
        </div>

        <div class="center-pill">
          <div class="outer-pill">
            <div class="red-pill">
              <div class="outer-left-text">KOSOVA</div>
              <div class="outer-right-text">TÜRKIYE</div>
              <div class="black-pill">
                <div class="center-dash"></div>
                <div class="left-number">2</div>
                <div class="right-number">3</div>
                <img src="../assets/33115791.png" class="center-icon" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Attempt to reuse user customization from teams.js if available
      function hexToRgba(hex, opacity) {
        try {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        } catch (e) {
          return hex;
        }
      }

      function applySavedStyles() {
        const urlParams = new URLSearchParams(window.location.search);
        const bgColor = urlParams.get("bgColor");
        const bgOpacity = urlParams.has("bgOpacity")
          ? parseInt(urlParams.get("bgOpacity"))
          : null;
        const textColor = urlParams.get("textColor");

        const left = document.querySelector(".bar.left");
        const right = document.querySelector(".bar.right");
        const center = document.querySelector(".center-pill");

        if (bgColor) {
          const op = bgOpacity !== null ? bgOpacity / 100 : 1;
          // apply a subtle tint to the center
          center.style.background = hexToRgba(bgColor, op * 0.15);
        }

        if (textColor) {
          // not used in this blank template, but kept for compatibility
        }
      }

      // Load optional teams.js (existing project logic) for future behavior
      const script = document.createElement("script");
      script.src = "teams.js";
      script.onload = () => {
        applySavedStyles();
      };
      script.onerror = () => {
        applySavedStyles();
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

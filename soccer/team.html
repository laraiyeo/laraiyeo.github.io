<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Embed View - Soccer Live Tracker</title>
    <!-- SEO -->
    <meta name="robots" content="noindex, nofollow" />


<link rel="icon" href="soccer-ball-png-24.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        background: transparent;
        padding-top: 25px;
        padding-left: 50px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        height: 100vh;
      }

      #scaleWrapper {
        transform: scale(2);
        transform-origin: top left;
      }

      .card-footer {
        text-align: center;
        padding: 8px 0 4px 0;
        margin-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        font-family: Arial, sans-serif;
        margin-bottom: -10px;
      }

      .card-footer .footer-text {
        font-size: 14px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .card-footer .footer-icon {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }

      .game-card {
        margin: 0 auto;
        max-width: 400px;
      }

      .app-promo-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: rgba(0, 0, 0, 0.92);
        color: #ffffff;
        font-weight: 800;
        font-size: clamp(28px, 4vw, 56px);
        line-height: 1.2;
        letter-spacing: 0.5px;
        padding: 20px;
        box-sizing: border-box;
        white-space: normal;
      }
    </style>
    <script src="../assets/analytics.js"></script>
    <script src="../assets/split-screen.js"></script>
  </head>
  <body>
    <div id="scaleWrapper">
      <div id="gameBlockContainer"></div>
      <script>
        // Rotating footer (updates all .card-footer inside cards)
        const footerMessages = [
          { text: "SportsHeart", icon: "../assets/33115791.png" },
          { text: "Download on App Store", icon: "../assets/apple.png" },
          { text: "Download on Play Store", icon: "../assets/google.png" },
        ];
        let footerIndex = 0;
        function rotateFooter() {
          footerIndex = (footerIndex + 1) % footerMessages.length;
          var msg = footerMessages[footerIndex];
          var labels = document.querySelectorAll(".card-footer .footer-label");
          var icons = document.querySelectorAll(".card-footer .footer-icon");
          for (var i = 0; i < labels.length; i++) {
            labels[i].textContent = msg.text;
            icons[i].src = msg.icon;
          }
        }
        setInterval(rotateFooter, 3000);

        const FOOTER_HTML =
          '<div class="card-footer"><div class="footer-text"><span class="footer-label">SportsHeart</span> <img class="footer-icon" src="../assets/33115791.png" alt=""></div></div>';

        function injectFooter(card) {
          if (!card.querySelector(".card-footer")) {
            card.insertAdjacentHTML("beforeend", FOOTER_HTML);
          }
        }

        const params = new URLSearchParams(window.location.search);
        const teamId = params.get("team");
        let currentHtml = "";

        const PROMO_INTERVAL_MS = 15 * 60 * 1000;
        const PROMO_DURATION_MS = 10 * 1000;

        function updateAppPromoOverlay() {
          const overlay = document.getElementById("appPromoOverlay");
          if (!overlay) return;
          const shouldShow = Date.now() % PROMO_INTERVAL_MS < PROMO_DURATION_MS;
          overlay.style.display = shouldShow ? "flex" : "none";
        }

        updateAppPromoOverlay();
        setInterval(updateAppPromoOverlay, 1000);

        // Custom styling functions
        function hexToRgba(hex, opacity) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function darkenColor(hex, amount) {
          amount = amount || 35;
          const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
          const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
          const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
          return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
        }

        function getTeamGradientStr(
          leftColor,
          rightColor,
          customBgColor,
          opacity,
        ) {
          const alpha = opacity / 100;
          const darkerLeft = darkenColor(leftColor);
          const darkerRight = darkenColor(rightColor);
          return `linear-gradient(to right, ${hexToRgba(leftColor, alpha)}, ${hexToRgba(darkerLeft, alpha)}, ${customBgColor}, ${hexToRgba(darkerRight, alpha)}, ${hexToRgba(rightColor, alpha)})`;
        }

        function loadSavedStyles() {
          // URL parameters always take priority over localStorage
          const urlParams = new URLSearchParams(window.location.search);
          if (
            urlParams.has("bgColor") ||
            urlParams.has("bgOpacity") ||
            urlParams.has("textColor")
          ) {
            const bgOpacityParam = urlParams.get("bgOpacity");
            return {
              backgroundColor: urlParams.get("bgColor") || "#000000",
              backgroundOpacity:
                bgOpacityParam !== null ? parseInt(bgOpacityParam) : 100,
              textColor: urlParams.get("textColor") || "#ffffff",
            };
          }

          // Only use localStorage if no URL parameters are present
          const saved = localStorage.getItem("soccer-game-card-styles");
          return saved
            ? JSON.parse(saved)
            : {
                backgroundColor: "#000000",
                backgroundOpacity: 100,
                textColor: "#ffffff",
              };
        }

        function applyCustomStylesToCard(card) {
          const customStyles = loadSavedStyles();
          const homeColor = card.getAttribute("data-home-color") || "#000000";
          const awayColor = card.getAttribute("data-away-color") || "#000000";
          const dir = card.getAttribute("data-dir") === "1";
          const gradient = getTeamGradientStr(
            homeColor,
            awayColor,
            customStyles.backgroundColor,
            customStyles.backgroundOpacity,
            dir,
          );
          card.style.setProperty("background", gradient, "important");
          card.style.setProperty("color", customStyles.textColor, "important");
        }

        async function fetchAndRenderTeamGame(teamId) {
          const tuesdayRange = getTuesdayRange();

          try {
            // Use the same comprehensive game fetching as teams.js
            const games = await fetchGamesFromAllCompetitions(tuesdayRange);

            const container = document.getElementById("gameBlockContainer");

            // Find all games for this team
            const teamGames = games.filter((game) =>
              game.competitions[0].competitors.some(
                (competitor) => competitor.team.id === teamId,
              ),
            );

            // Use the same game selection logic as teams.js
            const game = selectBestGameForTeam(teamGames);

            if (!game) {
              let teamsData;
              try {
                const teamsRes = await fetch(
                  `https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeague}/teams`,
                );
                teamsData = await teamsRes.json();
              } catch (e) {
                const teamsRes = await fetch(
                  `https://r.jina.ai/https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeague}/teams`,
                );
                const teamsRawText = await teamsRes.text();
                teamsData = JSON.parse(
                  teamsRawText.slice(teamsRawText.indexOf("{")),
                );
              }
              const team = teamsData.sports[0].leagues[0].teams
                .map((teamData) => teamData.team)
                .find((t) => t.id === teamId);

              const logoUrl = ["367", "2950", "92"].includes(team.id)
                ? team.logos?.find((logo) => logo.rel.includes("default"))
                    ?.href || ""
                : team.logos?.find((logo) => logo.rel.includes("dark"))?.href ||
                  `https://a.espncdn.com/i/teamlogos/soccer/500/${teamId}.png`;
              const noGameCard = document.createElement("div");
              noGameCard.className = "game-card no-game-card";
              noGameCard.style.display = "flex";
              noGameCard.style.flexDirection = "column";
              noGameCard.style.alignItems = "center";
              noGameCard.style.justifyContent = "center";
              noGameCard.style.gap = "10px";
              noGameCard.style.padding = "20px";
              noGameCard.style.width = "300px";

              // Set team-color data attrs (soccer: home left, away right)
              const teamColorHex = team?.color ? "#" + team.color : "#000000";
              noGameCard.setAttribute("data-away-color", teamColorHex);
              noGameCard.setAttribute("data-home-color", "#000000");
              noGameCard.setAttribute("data-dir", "1");

              noGameCard.innerHTML = `
            <img src="${logoUrl}" alt="${team?.displayName || "Unknown"} logo" class="card-team-logo">
            <div class="no-game-text">No game scheduled <br> this week</div>
          `;

              const newHtml = noGameCard.innerHTML;
              if (newHtml !== currentHtml) {
                container.innerHTML = "";
                injectFooter(noGameCard);
                container.appendChild(noGameCard);
                applyCustomStylesToCard(noGameCard);
                currentHtml = newHtml;
              }
              return;
            }

            if (typeof buildGameCard === "function") {
              // Find the team object for the specific teamId we're displaying
              const team =
                game.competitions[0].competitors.find(
                  (c) => c.team.id === teamId,
                )?.team ||
                game.competitions[0].competitors[0]?.team ||
                {};
              const cardHtml = await buildGameCard(game, team);
              const newHtml = cardHtml;
              if (newHtml !== currentHtml) {
                container.innerHTML = "";
                container.innerHTML = cardHtml;
                currentHtml = newHtml;
                // Apply custom styles to all game cards
                const gameCards = document.querySelectorAll(".game-card");
                gameCards.forEach((card) => applyCustomStylesToCard(card));
              }
            }
          } catch (err) {
            console.error("Error loading team game block:", err);
          }
        }

        const script = document.createElement("script");
        script.src = "teams.js";
        document.body.appendChild(script);

        script.onload = () => {
          // Override currentLeague from URL parameter if provided
          const leagueParam = params.get("league");
          if (leagueParam) {
            currentLeague = leagueParam;
          }

          if (teamId) {
            // Show the game card immediately on load
            fetchAndRenderTeamGame(teamId);

            setInterval(async () => {
              await fetchAndRenderTeamGame(teamId);
            }, 6000);
          }
        };
      </script>
    </div>
  </body>
</html>

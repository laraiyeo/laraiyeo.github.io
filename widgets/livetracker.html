<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LiveTracker Widget</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;

        /* Default page size (can be overridden by ?w=WIDTH and formula params n,d,o) */
        width: 800px;
        height: 404px;
        overflow: hidden; /* Hide scrollbars */
      }

      .wrapper {
        width: 800px;
        height: 404px;
        margin: 0 auto;
        padding: 0;
        box-sizing: border-box;
      }

      .notice {
        padding: 12px;
        background: #111;
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 12px;
      }

      iframe {
        width: 800px;
        height: 404px;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div id="notice" class="notice">Loading widget…</div>
      <div id="frameContainer"></div>
    </div>

    <script>
      // Read ?id= or ?uuid= and optional profile, width and formula params (n,d,o)
      function qs(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const id = qs("id") || qs("uuid");
      const profile = qs("profile") || "1gheey76n2szh3n14w1g";
      const lang = qs("lang") || "en";
      const mode = qs("mode") || "3d";
      const sport = qs("sport") || "football";

      // Formula pieces: n/d * width + o
      const formulaN = parseInt(qs("n")) || 404;
      const formulaD = parseInt(qs("d")) || 800;
      const formulaO = parseInt(qs("o")) || 50;

      // Optional width param from caller (device width in px). If missing, fall back to 800
      const requestedWidth = parseInt(qs("w")) || 800;

      const notice = document.getElementById("notice");
      const container = document.getElementById("frameContainer");

      if (!id) {
        notice.innerText =
          "No id provided. Use ?id=UUID to load a live-tracker.";
      } else {
        notice.style.display = "none";

        // Compute visual size using fixed ratio (404/800 = 0.505)
        const ratio = 0.505;
        const visualWidth = requestedWidth;
        const visualHeight =
          Math.round(visualWidth * ratio) + (parseInt(qs("o")) || 50);

        // Apply sizes to document and wrapper so the host sees the expected dimensions
        document.documentElement.style.width = visualWidth + "px";
        document.documentElement.style.height = visualHeight + "px";
        document.body.style.width = visualWidth + "px";
        document.body.style.height = visualHeight + "px";
        const wrapper = document.querySelector(".wrapper");
        wrapper.style.width = visualWidth + "px";
        wrapper.style.height = visualHeight + "px";

        // Build widget src and forward optional logo/reverse params
        let src = `https://widgets.thesports01.com/${lang}/${mode}/${encodeURIComponent(
          sport
        )}?profile=${encodeURIComponent(profile)}&uuid=${encodeURIComponent(
          id
        )}`;

        const homeLogoParam = qs("home_logo") || qs("homeLogo") || null;
        const awayLogoParam = qs("away_logo") || qs("awayLogo") || null;
        const reverseParam = qs("reverse") || null;

        if (homeLogoParam) {
          src += `&home_logo=${encodeURIComponent(homeLogoParam)}`;
        }
        if (awayLogoParam) {
          src += `&away_logo=${encodeURIComponent(awayLogoParam)}`;
        }
        if (reverseParam) {
          src += `&reverse=${encodeURIComponent(reverseParam)}`;
        }

        // Ensure wrapper and container inline styles match computed size
        const frameContainer = document.getElementById("frameContainer");
        frameContainer.style.width = visualWidth + "px";
        frameContainer.style.height = visualHeight + "px";
        frameContainer.style.overflow = "hidden";

        const srcIframe = document.createElement("iframe");
        srcIframe.src = src;
        // Use inline styles to override any stylesheet defaults
        srcIframe.style.width = visualWidth + "px";
        srcIframe.style.height = visualHeight + "px";
        srcIframe.style.border = "0";
        srcIframe.style.display = "block";
        srcIframe.scrolling = "no";
        srcIframe.setAttribute("title", "LiveTracker Widget");
        frameContainer.appendChild(srcIframe);

        // If embedded in a WebView, post the computed visual height so the host can size itself.
        function postSize() {
          try {
            if (
              window.ReactNativeWebView &&
              window.ReactNativeWebView.postMessage
            ) {
              window.ReactNativeWebView.postMessage(String(visualHeight));
            }
          } catch (e) {
            // ignore
          }
        }

        postSize();
        // Also post again if the window resizes (dev tooling)
        window.addEventListener("resize", postSize);
      }
    </script>
  </body>
</html>

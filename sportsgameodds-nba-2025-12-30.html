<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="apple-itunes-app" content="app-id=6754208862, app-argument=https://sportsheart.ca/" />
  <title>SportsGameOdds — NBA events (2025-12-30)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;margin:0;padding:20px;background:#f6f8fb;color:#0b1220}
    h1{font-size:20px;margin:0 0 12px}
    .event{background:#fff;border:1px solid #e3e7ee;padding:14px;border-radius:8px;margin-bottom:12px}
    .row{display:flex;gap:12px;align-items:center}
    .teams{font-weight:600}
    .muted{color:#556; font-size:13px}
    .section{margin-top:10px}
    pre{background:#0b1220;color:#e6f0ff;padding:10px;border-radius:6px;overflow:auto}
    .badge{background:#eef6ff;color:#0366d6;padding:4px 8px;border-radius:999px;font-size:12px}
    details{margin-top:8px}
    summary{cursor:pointer}
    a.book{color:#0366d6}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{border:1px solid #eee;padding:6px;text-align:left;font-size:13px}
    th{background:#fafbff}
  </style>
</head>
<body>
  <h1>SportsGameOdds — NBA events (sample: 2025-12-30 to 2026-01-01)</h1>
  <p class="muted">This page renders a sample response for the requested endpoint and shows event details, teams, status, links, odds markets, and players.</p>
  <div id="events"></div>

  <script>
    const API_URL = 'https://api.sportsgameodds.com/v2/events?leagueID=NBA&startsAfter=2025-12-30T00:00:00Z&startsBefore=2026-01-01T00:00:00Z&ended=false&live=false&bookmakerID=draftkings&includeOpposingOdds=false&expandResults=false&apiKey=09a4de43e78a93453e9143b1d4e501f0';
    const container = document.getElementById('events');
    let events = [];
    let page = 1;
    const pageSize = 25;

    function setLoading(msg){ container.innerHTML = `<p class="muted">${escapeHtml(msg)}</p>`; }

    async function fetchAndRender(){
      setLoading('Fetching live events from SportsGameOdds...');
      try{
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const json = await res.json();
        if (!json || !Array.isArray(json.data)) throw new Error('Invalid response');
        events = json.data;
        page = 1;
        renderPage();
      }catch(err){
        container.innerHTML = `<p class="muted">Fetch error: ${escapeHtml(String(err))}</p>`;
      }
    }

    function renderPage(){
      container.innerHTML = '';
      const start = (page-1)*pageSize;
      const pageItems = events.slice(start, start+pageSize);

      const controls = document.createElement('div');
      controls.className = 'section muted';
      const totalPages = Math.max(1, Math.ceil(events.length / pageSize));
      controls.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <button id="prev">◀ Prev</button>
          <div>Page ${page} / ${totalPages} · Events: ${events.length}</div>
          <button id="next">Next ▶</button>
          <button id="refresh">Refresh</button>
          <label style="margin-left:12px"><input id="showRaw" type="checkbox"> Show raw JSON</label>
        </div>
      `;
      container.appendChild(controls);

      document.getElementById('prev').onclick = ()=>{ if(page>1){page--; renderPage();} };
      document.getElementById('next').onclick = ()=>{ if(page<totalPages){page++; renderPage();} };
      document.getElementById('refresh').onclick = ()=>fetchAndRender();

      pageItems.forEach(event=>{
        const el = document.createElement('div'); el.className='event';
        const away = event.teams?.away?.names?.long || 'Away';
        const home = event.teams?.home?.names?.long || 'Home';
        const teamsText = `${away} @ ${home}`;
        const { general: dkGeneral, playerMap: dkPlayerMap } = partitionOddsForDraftKings(event.odds || {});
        const generalHtml = renderGeneralMarkets(dkGeneral);
        const playersHtml = renderPlayerPropsSection(event, dkPlayerMap);
        el.innerHTML = `
          <div class="row">
            <div style="flex:1">
              <div class="teams">${escapeHtml(teamsText)}</div>
              <div class="muted">Event ID: ${escapeHtml(event.eventID||'')} · League: ${escapeHtml(event.leagueID||'')} · ${escapeHtml(event.type||'')}</div>
            </div>
            <div style="text-align:right">
              <div class="badge">${escapeHtml(event.status?.displayLong || (event.status?.live? 'Live':'Upcoming'))}</div>
              <div class="muted">Starts: ${escapeHtml(event.status?.startsAt ? new Date(event.status.startsAt).toLocaleString() : '')}</div>
            </div>
          </div>

          <div class="section"><strong>Info</strong><div class="muted">${escapeHtml(event.info?.seasonWeek||'')}</div></div>

          <details class="section"><summary><strong>Teams</strong></summary>
            <table><thead><tr><th>Side</th><th>Team</th><th>Team ID</th></tr></thead><tbody>
              <tr><td>Away</td><td>${escapeHtml(event.teams?.away?.names?.long||'')}</td><td>${escapeHtml(event.teams?.away?.teamID||'')}</td></tr>
              <tr><td>Home</td><td>${escapeHtml(event.teams?.home?.names?.long||'')}</td><td>${escapeHtml(event.teams?.home?.teamID||'')}</td></tr>
            </tbody></table>
          </details>

          <details class="section"><summary><strong>Bookmaker Links</strong></summary>
            <ul>${Object.entries(event.links?.bookmakers||{}).map(([bk,url])=>`<li><a class="book" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(bk)}</a></li>`).join('')}</ul>
          </details>

          <details class="section" open><summary><strong>Odds Markets (${dkGeneral.length})</strong></summary>
            ${generalHtml}
          </details>

          <details class="section"><summary><strong>Player Props (DraftKings)</strong></summary>
            ${playersHtml}
          </details>

          <div class="section muted"><small>Raw event JSON (click to expand)</small></div>
          <details class="section raw-json"><summary>Raw JSON</summary><pre>${escapeHtml(JSON.stringify(event, null, 2))}</pre></details>
        `;
        container.appendChild(el);
      });

      const showRawCheckbox = document.getElementById('showRaw');
      showRawCheckbox.onchange = ()=>{
        document.querySelectorAll('.raw-json').forEach(d=>{ d.style.display = showRawCheckbox.checked ? 'block' : 'none'; });
      };
      // hide raw by default
      document.querySelectorAll('.raw-json').forEach(d=>d.style.display='none');
    }

    function partitionOddsForDraftKings(odds){
      const all = Object.values(odds||{});
      const dkOnly = all.filter(m => m && m.byBookmaker && m.byBookmaker.draftkings);
      const general = [];
      const playerMap = {}; // playerID -> [markets]
      dkOnly.forEach(m => {
        const pid = m.playerID || m.statEntityID;
        if (pid) {
          if (!playerMap[pid]) playerMap[pid] = [];
          playerMap[pid].push(m);
        } else {
          general.push(m);
        }
      });
      return { general, playerMap };
    }

    function renderMarketDraftKings(market){
      const dk = (market.byBookmaker && market.byBookmaker.draftkings) || {};
      const odds = escapeHtml(dk.odds || market.bookOdds || '');
      const line = escapeHtml(dk.overUnder || dk.spread || market.bookOverUnder || market.fairOverUnder || '');
      const available = escapeHtml(String(dk.available ?? ''));
      return `
        <div style="margin:8px 0;padding:8px;background:#fbfdff;border-radius:6px;border:1px solid #eef3ff">
          <div style="font-weight:600">${escapeHtml(market.marketName||market.oddID)} <span class="muted">(${escapeHtml(market.betTypeID||'')}/${escapeHtml(market.sideID||'')})</span></div>
          <div class="muted">Fair: ${escapeHtml(market.fairOdds||'')} · Book: ${escapeHtml(market.bookOdds||'')} · Line: ${line}</div>
          <div style="margin-top:6px">
            <table><thead><tr><th>Bookmaker</th><th>Odds</th><th>Line</th><th>Available</th></tr></thead><tbody>
              <tr><td>draftkings</td><td>${odds}</td><td>${line}</td><td>${available}</td></tr>
            </tbody></table>
          </div>
        </div>`;
    }

    function renderGeneralMarkets(markets){
      if (!markets || markets.length===0) return '<div class="muted">No DraftKings markets</div>';
      return markets.map(m=>renderMarketDraftKings(m)).join('');
    }

    function renderPlayerPropsSection(event, playerMap){
      if (!playerMap || Object.keys(playerMap).length===0) return `<div class="muted">No player props for DraftKings</div>`;
      // build map of playerID -> display name from event.players
      const players = event.players || {};
      return Object.entries(playerMap).map(([pid, markets])=>{
        const player = players[pid] || { name: pid };
        const rows = markets.map(m=>{
          const dk = m.byBookmaker.draftkings || {};
          const odds = escapeHtml(dk.odds || m.bookOdds || '');
          const line = escapeHtml(dk.overUnder || dk.spread || m.bookOverUnder || m.fairOverUnder || '');
          const available = escapeHtml(String(dk.available ?? ''));
          return `<tr><td>${escapeHtml(m.marketName||m.oddID)}</td><td>${odds}</td><td>${line}</td><td>${available}</td></tr>`;
        }).join('');
        return `
          <details class="section"><summary><strong>${escapeHtml(player.name || pid)}</strong></summary>
            <table><thead><tr><th>Prop</th><th>Odds</th><th>Line</th><th>Available</th></tr></thead><tbody>
              ${rows}
            </tbody></table>
          </details>
        `;
      }).join('');
    }

    function escapeHtml(s){ if (s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

    // Kick off initial fetch
    fetchAndRender();
  </script>
  </script>
</body>
</html>

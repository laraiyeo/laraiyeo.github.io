<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5256386471137141"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta
      name="apple-itunes-app"
      content="app-id=6754208862, app-argument=https://sportsheart.ca/"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Teams - NHL Live Tracker</title>
    <link rel="icon" href="/assets/33115791.png" type="image/png" />
    <link rel="stylesheet" href="/assets/dark-mode.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/assets/team-cards.css" />
    <style>
      #customization-panel input[type="color"] {
        cursor: pointer;
      }
      #customization-panel input[type="range"] {
        cursor: pointer;
      }
      #customization-panel button:hover {
        background: #b02a37 !important;
      }
      #customization-panel input[type="text"],
      #customization-panel input[type="number"] {
        text-align: center;
      }

      /* Customization panel removed */
      #customization-panel {
        display: none !important;
      }
    </style>
    <script src="../assets/analytics.js"></script>
    <script src="../assets/split-screen.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-left">
        <a href="/" class="navbar-logo"
          ><img
            style="margin-top: 5px"
            src="/assets/33115791.png"
            alt="SportsHeart"
            onerror="this.style.display = 'none'"
          /><span>SportsHeart</span></a
        >
      </div>
      <div class="navbar-center">
        <a href="/mlb/aio.html" class="nav-link">MLB</a>
        <a href="/nhl/aio.html" class="nav-link active">NHL</a>
        <a href="/nba/aio.html" class="nav-link">NBA</a>
        <a href="/nfl/aio.html" class="nav-link">NFL</a>
        <a href="/wnba/aio.html" class="nav-link">WNBA</a>
      </div>
      <div class="navbar-right"><div id="auth-button-container"></div></div>
    </nav>

    <div id="scoreboard">
      <p class="teams-hint">Click Team To Copy Obs Link</p>

      <!-- Customization Controls -->
      <div
        id="customization-panel"
        style="
          background: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 8px;
          padding: 15px;
          margin-bottom: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
          align-items: center;
          justify-content: center;
        "
      >
        <!-- Background Color -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
          "
        >
          <label style="font-weight: bold; color: #333; font-size: 0.9em"
            >Background Color</label
          >
          <div style="display: flex; align-items: center; gap: 8px">
            <input
              type="color"
              id="bg-color-picker"
              value="#000000"
              style="
                width: 40px;
                height: 30px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
              "
            />
            <input
              type="text"
              id="bg-color-hex"
              value="#000000"
              placeholder="#000000"
              style="
                width: 80px;
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: monospace;
                font-size: 0.85em;
              "
            />
          </div>
          <div
            id="bg-preview"
            style="
              width: 50px;
              height: 20px;
              border: 1px solid #ccc;
              border-radius: 3px;
              background-color: #000000;
            "
          ></div>
        </div>

        <!-- Background Opacity -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
          "
        >
          <label style="font-weight: bold; color: #333; font-size: 0.9em"
            >Background Opacity</label
          >
          <div style="display: flex; align-items: center; gap: 8px">
            <input
              type="range"
              id="bg-opacity-slider"
              min="0"
              max="100"
              value="100"
              style="width: 100px"
            />
            <input
              type="number"
              id="bg-opacity-input"
              min="0"
              max="100"
              value="100"
              style="
                width: 50px;
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 0.85em;
              "
            />
            <span style="font-size: 0.85em; color: #777">%</span>
          </div>
        </div>

        <!-- Text Color -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
          "
        >
          <label style="font-weight: bold; color: #333; font-size: 0.9em"
            >Text Color</label
          >
          <div style="display: flex; align-items: center; gap: 8px">
            <input
              type="color"
              id="text-color-picker"
              value="#ffffff"
              style="
                width: 40px;
                height: 30px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
              "
            />
            <input
              type="text"
              id="text-color-hex"
              value="#ffffff"
              placeholder="#ffffff"
              style="
                width: 80px;
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: monospace;
                font-size: 0.85em;
              "
            />
          </div>
          <div
            id="text-preview"
            style="
              width: 50px;
              height: 20px;
              border: 1px solid #ccc;
              border-radius: 3px;
              background-color: #ffffff;
            "
          ></div>
        </div>

        <!-- Reset Button -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
          "
        >
          <label style="font-weight: bold; color: #333; font-size: 0.9em"
            >Reset</label
          >
          <button
            id="reset-styles"
            style="
              padding: 8px 16px;
              background: #dc3545;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              font-weight: bold;
              font-size: 0.9em;
            "
          >
            Reset to Default
          </button>
        </div>
      </div>

      <div id="gamesContainer" class="games-container"></div>
    </div>

    <script src="/assets/sports-data-service.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/assets/auth.js"></script>
    <script src="/assets/split-screen.js"></script>
    <script src="teams.js"></script>
  </body>
</html>
